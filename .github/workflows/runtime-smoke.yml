name: Runtime smoke
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  runtime-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      # M7 supplies the CLI/MCP Tier C orchestrator before manual execution.
      - run: node tools/runtime-smoke.mjs --entry cli
      - run: node tools/runtime-smoke.mjs --entry mcp
