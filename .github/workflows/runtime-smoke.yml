name: Runtime smoke
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  runtime-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node tools/runtime-smoke.mjs --entry cli --commit "${{ github.sha }}"
      - run: node tools/runtime-smoke.mjs --entry mcp --commit "${{ github.sha }}"
        if: ${{ !cancelled() }}
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: runtime-smoke-evidence
          path: .agent-work/m7-evidence
